# ─────────────────────────────────────────────────────────────────────────────
# A full deployment for an embedded board with the hardware transport present.
#
# This is where "which artifacts does THIS machine need" is decided. Note that no
# component and no target had to know about this choice: the FPGA transport
# libraries are simply listed here, and a board without an FPGA uses a different
# bundle file that does not list them.
#
# The obvious alternative expresses the same idea as a hand-maintained bash array
# inside one bundling script per machine. Two scripts that differ only in a list of
# filenames is a list that wants to be data.
# ─────────────────────────────────────────────────────────────────────────────

BUNDLE_NAME=example-board-full
BUNDLE_DESC="Full board deployment: executor, runtime, device and hardware transport"

BUNDLE_COMPONENTS=example-executor example-runtime-capi example-transport-runtime example-device-null

# Included when built, skipped without complaint otherwise. These need FPGA_HWHS,
# which not every developer has, and a whole-tree build should not fail for the people
# who do not.
#
# The FPGA session, NOT example-transport-session: the two are competing implementations
# of the same slot — rt_transport dlopens exactly one session — so a bundle carrying both
# would ship the machine two answers to one question. The server bundles list the
# software session for the same reason, from the other side.
BUNDLE_OPTIONAL_COMPONENTS=example-fpga-session example-transport-backend

# Ship the C++ runtime we linked against, taken FROM THE SYSROOT. With
# TARGET_RPATH=$$ORIGIN the loader finds it beside the binaries, so the bundle runs
# on a target whose own libstdc++ is older — without resorting to static linking.
BUNDLE_SYSROOT_LIBS=libstdc++.so.6

BUNDLE_STRIP=no
