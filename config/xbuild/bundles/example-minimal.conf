# The smallest useful deployment: enough to exercise the executor with no
# simulator, no transport, and no hardware. Useful as a first bring-up on a new
# board, because if this does not run, nothing larger will — and it isolates
# "is my toolchain and sysroot right" from "is my application right".

BUNDLE_NAME=example-minimal
BUNDLE_DESC="Smoke-test deployment: executor plus the null device only"

BUNDLE_COMPONENTS=example-executor example-runtime-capi example-device-null
BUNDLE_STRIP=no
