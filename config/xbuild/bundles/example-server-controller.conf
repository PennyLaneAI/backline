# The same machine can host different roles, and the role is decided by which
# libraries are present — so a role IS a bundle. This is the controller role.
#
# Keeping roles as separate bundle files rather than as one bundle with everything
# means the deployed directory contains only what the role needs, which makes "what
# is this machine doing?" answerable by listing a directory.

BUNDLE_NAME=example-server-controller
BUNDLE_DESC="x86_64 server acting as the controller"

BUNDLE_COMPONENTS=example-executor example-runtime-capi example-transport-runtime
BUNDLE_OPTIONAL_COMPONENTS=example-transport-session

BUNDLE_STRIP=yes
