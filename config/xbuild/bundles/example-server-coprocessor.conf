# The coprocessor role on the same hardware: same executor and runtime, different
# transport side, plus the GPU coprocessor when the machine has one.

BUNDLE_NAME=example-server-coprocessor
BUNDLE_DESC="x86_64 server acting as the coprocessor (GPU offload when available)"

BUNDLE_COMPONENTS=example-executor example-runtime-capi example-transport-runtime
BUNDLE_OPTIONAL_COMPONENTS=gpu-coprocessor

BUNDLE_STRIP=yes
