# Everything rhino (GH200) runs as the coprocessor host, in one deploy: the same set as
# threadripper-bundle, built for targets/rhino.conf (aarch64, glibc 2.35, an GH200 at sm_90).
#
# gpu-coprocessor compiles device code, so it is built on rhino itself (COMPONENT_REQUIRES_NATIVE)
# with ROCm's hipcc driving nvcc, and copied into build/rhino/components before `make bundle`.
# The other components cross-compile from the build host as usual.
BUNDLE_NAME=rhino-bundle
BUNDLE_DESC="Coprocessor host stack for rhino (GH200): executor, transport runtime, and the CPU and GPU backends"

BUNDLE_COMPONENTS=executor rt-transport rt-capi rtd-null-qubit cpu-verbs-controller cpu-verbs-coprocessor steane-coprocessor-cpu echo-coprocessor-cpu

BUNDLE_OPTIONAL_COMPONENTS=gpu-coprocessor

# Keep symbols: the benchmarks read latency out of these and a stripped coprocessor makes a
# profile unreadable.
BUNDLE_STRIP=no
