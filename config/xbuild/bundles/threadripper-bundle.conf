# Everything the x86-64 coprocessor host runs, in one deploy.
#
# Named after the machine, as vpk-bundle is, and for a sharper reason here: in demos 2, 2a
# and 3 this machine hosts BOTH ends — the controller on its CPU and the coprocessor on its
# GPU — so a name taken from either role would be half the truth. `config/machines.toml`
# deploys it to [server] under this name, which is why the name is what it is.
#
# The contents are derived from what the placements actually name:
#   executor                   machines.toml runs ./catalyst-executor through executor_bin
#   rt-transport, rt-capi      a launched executor loads both
#   rtd-null-qubit             demos 2 and 2a give the controller qp.device("null.qubit")
#   cpu-verbs-controller       REMOTE_CPU_CTRL, in demos 2, 2a and 3
#   cpu-verbs-coprocessor      REMOTE_CPU_COPROC, in the benchmarks
#   steane/echo-coprocessor-cpu   dlopened by filename by the benchmark's CPU cells
BUNDLE_NAME=threadripper-bundle
BUNDLE_DESC="Coprocessor host stack: executor, transport runtime, and the CPU and GPU backends"

BUNDLE_COMPONENTS=executor rt-transport rt-capi rtd-null-qubit cpu-verbs-controller cpu-verbs-coprocessor steane-coprocessor-cpu echo-coprocessor-cpu

# The GPU backend is optional HERE, at the bundle, rather than in the component. A machine
# without a HIP toolchain still gets a working CPU-only bundle, while a genuine compile
# failure in the component itself is still an error — which is the distinction that
# COMPONENT_OPTIONAL=yes inside the component erased.
BUNDLE_OPTIONAL_COMPONENTS=gpu-coprocessor

# Keep symbols: the benchmarks read latency out of these and a stripped coprocessor makes a
# profile unreadable.
BUNDLE_STRIP=no
