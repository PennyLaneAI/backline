# The controller stack the demos and the benchmark ship to the VPK120.
#
# One deploy carries both ways of driving the board, because both arrangements share a single
# executor there: the hwhs backend and its session for the round the engine drives itself, and the
# swhs backend for the round the CPU posts over ibverbs and polls for itself. Under either sits
# rt-transport, the transport runtime.
#
# The hwhs three are the artifacts rdma_dev/demos/Makefile listed as VPK_LIBS, in that order.
# catalyst-executor goes with them: it is the process that runs the controller's share of the
# compiled program, and without it the deployed workspace has nothing to start.
BUNDLE_NAME=vpk-bundle
BUNDLE_DESC="Controller stack for the VPK120: both controller arrangements, and the transport runtime"

# rt-capi and rtd-null-qubit are here because the executor dlopens them by absolute path in the
# workspace: the runtime C API, and the device runtime for the null.qubit the controller node
# carries. Without them the executor starts and then reports
# "dlopen(.../librt_capi.so) failed: cannot open shared object file".
BUNDLE_COMPONENTS=executor rt-capi rtd-null-qubit hwhs-capi-backend hwhs-controller-session swhs-capi-backend rt-transport

# The artifacts here are not stripped, and the demos read the engine's own RTT
# histogram out of the session's output — keep the symbols.
BUNDLE_STRIP=no
