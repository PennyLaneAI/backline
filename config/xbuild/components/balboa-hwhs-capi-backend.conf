# The controller for the VPK120 when its FPGA carries ETH Zurich's BALBOA RoCE v2 stack and
# backline-roce's hwhs-balboa engine in front of it, in place of ERNIC and hwhs. The engine plays
# hwhs's part: it stamps, sends and times the round, and BALBOA turns the request into the RC
# RDMA WRITE. A node names it with backend="balboa_hwhs"; the coprocessor at the other end needs
# wire=balboa.
#
# One component, as swhs: the session is compiled into this library. Nothing here touches
# ibverbs, since the A72 reaches the engine and BALBOA through UIO alone.
COMPONENT_NAME=balboa-hwhs-capi-backend
COMPONENT_DESC="Controller for the VPK120 behind BALBOA (hwhs-balboa)"
COMPONENT_KIND=shared-library
# The filename Catalyst derives from backend="balboa_hwhs", and what its CMake builds.
COMPONENT_OUTPUT=libcatalyst_transport_balboa_hwhs_controller.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/rdma/fpga_balboa/BalboaBackend.cpp $(CATALYST)/runtime/lib/transport/rdma/fpga_balboa/BalboaControllerSession.cpp $(CATALYST)/runtime/lib/transport/rdma/fpga_balboa/BalboaDevice.cpp $(CATALYST)/runtime/lib/transport/rdma/common/OobSocket.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/lib/transport/rdma/fpga_balboa $(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface

COMPONENT_LIBS=pthread
