# The CPU controller: posts the syndrome through ibverbs and polls for the reply. This is
# what a node gets by naming hardware="cpu" (the default) with the rdma transport, so the
# output filename is an interface rather than a name.
#
# The rdma/common sources are listed because Catalyst supplies them through its
# transport_common library, which a component build has no equivalent of.
COMPONENT_NAME=cpu-verbs-controller
COMPONENT_DESC="CPU controller transport backend (RDMA verbs)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=libcatalyst_transport_cpu_verbs_controller.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/base/CpuSessionBase.cpp $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/controller/CpuControllerSession.cpp $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/controller/CpuControllerFactory.cpp $(CATALYST)/runtime/lib/transport/rdma/common/CompletionQueue.cpp $(CATALYST)/runtime/lib/transport/rdma/common/Context.cpp $(CATALYST)/runtime/lib/transport/rdma/common/MemoryRegion.cpp $(CATALYST)/runtime/lib/transport/rdma/common/OobSocket.cpp $(CATALYST)/runtime/lib/transport/rdma/common/ProtectionDomain.cpp $(CATALYST)/runtime/lib/transport/rdma/common/QueuePair.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/base $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/controller

COMPONENT_LIBS=ibverbs pthread
