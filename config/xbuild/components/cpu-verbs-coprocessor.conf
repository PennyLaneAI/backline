# The CPU coprocessor: runs a decoder on the host and returns the correction. The
# benchmarks place one of these on the server to measure the fabric without a GPU in the
# round trip; it also serves as the fallback when no GPU is available.
COMPONENT_NAME=cpu-verbs-coprocessor
COMPONENT_DESC="CPU coprocessor transport backend (RDMA verbs)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=libcatalyst_transport_cpu_verbs_coprocessor.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/base/CpuSessionBase.cpp $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/coprocessor/CpuCoprocessorSession.cpp $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/coprocessor/CpuCoprocessorFactory.cpp $(CATALYST)/runtime/lib/transport/rdma/common/CompletionQueue.cpp $(CATALYST)/runtime/lib/transport/rdma/common/Context.cpp $(CATALYST)/runtime/lib/transport/rdma/common/MemoryRegion.cpp $(CATALYST)/runtime/lib/transport/rdma/common/OobSocket.cpp $(CATALYST)/runtime/lib/transport/rdma/common/ProtectionDomain.cpp $(CATALYST)/runtime/lib/transport/rdma/common/QueuePair.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/base $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/coprocessor

COMPONENT_LIBS=ibverbs pthread
