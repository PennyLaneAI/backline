# The echo "decoder": replies with what it received. The benchmarks use it to measure the
# fabric with no decoding in the round trip at all.
COMPONENT_NAME=echo-coprocessor-cpu
COMPONENT_DESC="Echo plugin for a CPU coprocessor (no decoding)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=libecho_coprocessor_cpu.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/common/coproc/cpu/echo_coprocessor_fn.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/common/interface $(CATALYST)/runtime/lib/transport/common/coproc

COMPONENT_LIBS=pthread
