# ─────────────────────────────────────────────────────────────────────────────
# A dlopen-able device plugin.
#
# This component is where the original tree's silent inconsistency lived: its
# ancestor linked with -static-libstdc++ -Wl,--exclude-libs,ALL while the sibling
# library built from the same tree for the same board did not, with nothing
# recording why. Here the choice is one declared field with a documented rationale,
# so it can be reviewed rather than inherited.
# ─────────────────────────────────────────────────────────────────────────────

COMPONENT_NAME=example-device-null
COMPONENT_DESC="Null device backend plugin (no simulator dependencies)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=librtd_null_qubit.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/backend/null_qubit/NullQubit.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/backend/null_qubit $(CATALYST)/runtime/lib/backend/common

# Deliberate: this plugin's ABI surface is the C device-interface only — no
# std:: types cross the dlopen boundary — so a private C++ runtime is safe here
# and makes the plugin loadable on a target with an older libstdc++.
# See components/SCHEMA.md, "COMPONENT_STATIC_CXX — the honest version",
# before copying this into a component that does pass std:: types.
COMPONENT_STATIC_CXX=yes
