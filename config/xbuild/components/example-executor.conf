# ─────────────────────────────────────────────────────────────────────────────
# A cmake-based component: an executable whose build is driven by an upstream
# CMakeLists.txt rather than by a direct compiler call.
#
# The cmake path and the direct-compiler path share ONE definition of the target's
# flags. The obvious alternative states them twice — once in a make variable for
# the direct path and once in a per-board cmake toolchain file — under a comment
# reading "KEEP IN SYNC". Here mk/rules.mk generates the cmake
# toolchain file from the same variables the direct path uses, so the two cannot
# disagree — there is nothing to synchronise.
# ─────────────────────────────────────────────────────────────────────────────

COMPONENT_NAME=example-executor
COMPONENT_DESC="Remote executor binary (upstream CMake project)"
COMPONENT_KIND=cmake-project
COMPONENT_OUTPUT=catalyst-executor

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_CMAKE_SOURCE_DIR=$(ROOT_DIR)/recipes/catalyst-executor
COMPONENT_CMAKE_TARGET=catalyst-executor
COMPONENT_CMAKE_ARGS=-DCATALYST_SRC=$(CATALYST)
