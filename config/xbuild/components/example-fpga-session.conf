# ─────────────────────────────────────────────────────────────────────────────
# The SAME kind of transport session, but for an FPGA device whose driver sources
# live OUTSIDE the main checkout.
#
# This is the component that genuinely needs a second source root, and it is the
# only reason FPGA_HWHS exists. Compare it with example-transport-session.conf: same
# kind, same libraries, same shared RDMA plumbing from CATALYST — the ONLY difference
# is that the session implementation and its vendor headers come from a separate tree.
#
# That comparison is the point of shipping both. A component declares the roots IT
# needs; needing a vendor tree is a property of this device, not of transports in
# general.
#
# WHERE FPGA_HWHS POINTS
# The directory containing the device's session/backend sources, with the patched
# vendor/ tree beside it rather than inside it, since two devices share that one
# copy. The real components point at Catalyst's own copy:
#
#     $(CATALYST)/runtime/lib/transport/rdma/fpga_hwhs, with .../rdma/vendor alongside
#
# Pass it on the command line, or set it once in config.mk:
#
#     make build TARGET=my-board CATALYST=~/catalyst FPGA_HWHS=~/my_device
#
# Check it before building:
#     ls $FPGA_HWHS/HwhsControllerSession.cpp $FPGA_HWHS/../vendor
#
# If you do not have that tree, do nothing: this component is optional and
# `make build` reports it as skipped. Nothing else in the tree depends on it.
# ─────────────────────────────────────────────────────────────────────────────

COMPONENT_NAME=example-fpga-session
COMPONENT_DESC="FPGA hardware transport session (needs the FPGA_HWHS device tree)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=libhwhs_controller_session.so

# TWO roots. Declaring FPGA_HWHS is what makes an unset value fail immediately, by
# name, instead of producing a compiler error about '/HwhsControllerSession.cpp'
# with an empty prefix.
COMPONENT_SOURCE_ROOTS=CATALYST FPGA_HWHS

# The device-specific session, plus the same shared RDMA plumbing from CATALYST that
# the CPU-verbs session uses. Note the split: infrastructure from CATALYST, device
# implementation from the vendor tree.
COMPONENT_SOURCES=$(FPGA_HWHS)/HwhsControllerSession.cpp $(CATALYST)/runtime/lib/transport/rdma/common/CompletionQueue.cpp $(CATALYST)/runtime/lib/transport/rdma/common/Context.cpp $(CATALYST)/runtime/lib/transport/rdma/common/MemoryRegion.cpp $(CATALYST)/runtime/lib/transport/rdma/common/OobSocket.cpp $(CATALYST)/runtime/lib/transport/rdma/common/ProtectionDomain.cpp $(CATALYST)/runtime/lib/transport/rdma/common/QueuePair.cpp

COMPONENT_INCLUDES=$(FPGA_HWHS) $(FPGA_HWHS)/../vendor $(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface

COMPONENT_LIBS=ibverbs pthread dl rt

# Optional: most people do not have the FPGA device tree, and a whole-tree build
# must not fail for them.
COMPONENT_OPTIONAL=yes
