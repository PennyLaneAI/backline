# ─────────────────────────────────────────────────────────────────────────────
# A shared library built from sources in an external checkout.
#
# Note what is absent: any mention of a target. The alternative is one 12-line
# recipe per (component, target) pair, each differing only in which flag variable
# and which sysroot variable it names. All of them collapse into this file plus
# the generic rule in mk/rules.mk.
# ─────────────────────────────────────────────────────────────────────────────

COMPONENT_NAME=example-runtime-capi
COMPONENT_DESC="Runtime C-API shared library (from the CATALYST checkout)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=librt_capi.so

# Declared, so an unset CATALYST is reported by name before anything compiles
# rather than producing '/runtime/lib/...: No such file'.
COMPONENT_SOURCE_ROOTS=CATALYST

COMPONENT_SOURCES=$(CATALYST)/runtime/lib/capi/RuntimeCAPI.cpp

COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/capi $(CATALYST)/mlir/include $(CATALYST)/mlir/llvm-project/mlir/include

COMPONENT_CXXFLAGS=-DLIBREGISTRY=\"catalyst_callback_registry.so\"

COMPONENT_LIBS=pthread dl
