# ─────────────────────────────────────────────────────────────────────────────
# A component that depends on ANOTHER COMPONENT, and needs a vendor tree.
#
# It depends on example-fpga-session (not example-transport-session): this is the
# FPGA backend plugin, so it pairs with the FPGA session. Both need FPGA_HWHS; the
# software CPU-verbs session needs nothing beyond CATALYST.
#
# COMPONENT_DEPENDS is how the tree learns build order. The original design
# expressed this by having one component's Makefile reach into another's build
# directory by literal path:
#
#   SESSION_LIB := $(CURDIR)/../hwhs-controller-session/build/vpk120/libhwhs_controller_session.so
#
# That string encodes the sibling's directory layout, its build-dir convention AND
# the board name. Any of the three changing breaks it, and it breaks as a
# "file not found" for a file the reader can see exists (just for another target).
# Naming the dependency instead lets the build system compute the path.
# ─────────────────────────────────────────────────────────────────────────────

COMPONENT_NAME=example-transport-backend
COMPONENT_DESC="FPGA transport backend plugin (needs FPGA_HWHS; depends on the FPGA session)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=libtransport_hw_backend.so

COMPONENT_SOURCE_ROOTS=CATALYST FPGA_HWHS
COMPONENT_SOURCES=$(FPGA_HWHS)/HwhsBackend.cpp
COMPONENT_INCLUDES=$(FPGA_HWHS) $(FPGA_HWHS)/../vendor $(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface

# Named, not path-referenced. mk/rules.mk resolves this to the sibling's actual
# output path for the target currently being built, and adds both the -L and the
# -l, and orders the builds.
COMPONENT_DEPENDS=example-fpga-session

COMPONENT_LIBS=pthread dl rt

# Not everyone has the FPGA device tree, and a missing optional device must not fail
# a whole-tree build for the people who do not use it. `make build` reports it as
# skipped.
COMPONENT_OPTIONAL=yes
