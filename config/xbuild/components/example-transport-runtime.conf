# ─────────────────────────────────────────────────────────────────────────────
# A library that other libraries are loaded into: it needs an RPATH so its
# siblings resolve from beside it in a deployed bundle.
#
# The RPATH itself is NOT set here. It comes from the target's TARGET_RPATH,
# because "where do I look for my siblings at runtime" is a property of how the
# machine is deployed, not of this source code. A component that hardcoded
# $ORIGIN would be making a deployment decision on the target's behalf.
# ─────────────────────────────────────────────────────────────────────────────

COMPONENT_NAME=example-transport-runtime
COMPONENT_DESC="Transport runtime that backend plugins register with"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=librt_transport.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/TransportCAPI.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/backend/common $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface

COMPONENT_LIBS=pthread dl
