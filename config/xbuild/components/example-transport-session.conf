# ─────────────────────────────────────────────────────────────────────────────
# An RDMA transport session built ENTIRELY from the CATALYST checkout.
#
# No vendor tree, no hardware SDK — just CATALYST and a libibverbs in the sysroot.
# This is the shape of the original tree's cpu_verbs transports, which referenced
# nothing outside CATALYST.
#
# WHY THIS FILE EXISTS SEPARATELY
# An earlier version of these examples had ONE "transport session" component that
# required a vendor SDK unconditionally. That was a modelling error on my part: it
# implied every transport needs an external device tree, when in fact the original
# tree had two independent families —
#
#   * cpu_verbs / gpu_verbs : sources entirely inside CATALYST  <- this file
#   * the FPGA hwhs device  : needs the vendor tree             <- *-fpga-session.conf
#
# and the RDMA plumbing they share (runtime/lib/transport/rdma/common/*) lives in
# CATALYST for both. Fusing them meant you could not build the software-only
# transport without pointing at hardware sources you may not have.
#
# The lesson worth keeping: an optional dependency belongs to the component that
# genuinely needs it, not to the category it happens to sit in.
# ─────────────────────────────────────────────────────────────────────────────

COMPONENT_NAME=example-transport-session
COMPONENT_DESC="CPU-verbs RDMA session (CATALYST only; needs libibverbs in the sysroot)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=libtransport_session.so

# CATALYST alone. Nothing else is declared, so nothing else is required.
COMPONENT_SOURCE_ROOTS=CATALYST

# The shared RDMA infrastructure plus the CPU-verbs implementation. Both come from
# CATALYST; the paths mirror the original transport-cpu-verbs Makefile.
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/rdma/common/CompletionQueue.cpp $(CATALYST)/runtime/lib/transport/rdma/common/Context.cpp $(CATALYST)/runtime/lib/transport/rdma/common/MemoryRegion.cpp $(CATALYST)/runtime/lib/transport/rdma/common/OobSocket.cpp $(CATALYST)/runtime/lib/transport/rdma/common/ProtectionDomain.cpp $(CATALYST)/runtime/lib/transport/rdma/common/QueuePair.cpp $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/base/CpuSessionBase.cpp $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/controller/CpuControllerSession.cpp

COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/backend/common $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/base $(CATALYST)/runtime/lib/transport/rdma/cpu_verbs/controller

# libibverbs is resolved from the TARGET's copy via the sysroot search path that
# mk/derive.mk composes — never the build host's. That distinction is the entire
# reason a sysroot exists.
COMPONENT_LIBS=ibverbs pthread dl rt

# Optional because not every target has RDMA hardware or libibverbs in its sysroot —
# not because it needs an SDK someone might be missing.
COMPONENT_OPTIONAL=yes
