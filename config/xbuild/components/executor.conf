# The process a remote node runs. `machines.toml` launches it by name through
# executor_bin, so every bundle for a machine that hosts a node needs it.
#
# A cmake-project rather than a source list: the executor is an upstream CMake target and
# the recipe under recipes/ is what points it at a Catalyst checkout.
COMPONENT_NAME=executor
COMPONENT_DESC="Remote executor binary (upstream CMake project)"
COMPONENT_KIND=cmake-project
COMPONENT_OUTPUT=catalyst-executor

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_CMAKE_SOURCE_DIR=$(ROOT_DIR)/recipes/catalyst-executor
COMPONENT_CMAKE_TARGET=catalyst-executor
# ALLOW_SYSTEM_LLVM widens what can satisfy the LLVM requirement; it does not weaken it.
# The recipe still prefers Catalyst's own build (its PINNED_GLOBS) and still enforces the
# LLVM 20-22 range either way — 23 renamed CWrapperFunctionResult and does not compile.
# Without this, only `make catalyst-llvm` can satisfy the executor, and since this component
# is a required member of threadripper-bundle that made the whole bundle unassemblable on a
# machine that had a perfectly good LLVM in its sysroot.
COMPONENT_CMAKE_ARGS=-DCATALYST_SRC=$(CATALYST) -DCATALYST_EXECUTOR_ALLOW_SYSTEM_LLVM=ON
