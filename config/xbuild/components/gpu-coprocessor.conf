# The GPU coprocessor: decodes a syndrome on the card and returns the correction over RDMA.
# This is the backend a node asks for by naming hardware="gpu" with the rdma transport, so the
# output filename is an interface — see COMPONENT_OUTPUT below.
#
# Transcribed from Catalyst's own CMake, which is the only authority on what goes into this
# library. The example this replaces was transcribed from the frozen origin tree's hand-written
# Makefile instead, and produced an artifact with no device code in it at all: it named
# GpuRuntime.hip, which holds no __global__ kernel, and not GpuLaunchers.hip, which holds the
# only one. Nothing caught that, which is why `make verify` now checks for undefined symbols.

COMPONENT_NAME=gpu-coprocessor
COMPONENT_DESC="GPU coprocessor backend with vendor-compiled device kernels (native only)"
COMPONENT_KIND=shared-library

# The filename the compiler derives from hardware="gpu" + transport="rdma", so a node finds it
# without naming it. Renaming this breaks every caller.
COMPONENT_OUTPUT=libcatalyst_transport_gpu_verbs_coprocessor.so

# HIP device code needs the vendor compiler, and vendor compilers do not cross-compile. The
# refusal is on the host CPU, not the GPU: the architecture flag below targets a card this
# machine need not have, but the x86-64 host code must be built on an x86-64 host.
COMPONENT_REQUIRES_NATIVE=yes
# hipcc for both vendors. On an NVIDIA target it dispatches to nvcc rather than to ROCm's
# clang++, which mk/rules.mk arranges by putting HIP_PLATFORM=nvidia in the recipe's
# environment; left unset there, hipcc picks clang++ and rejects the NVIDIA flags.
COMPONENT_CXX_OVERRIDE=hipcc

# The card to emit device code for comes from the target description, never from this machine.
# Without it the build stops by name rather than handing the driver an empty architecture.
COMPONENT_REQUIRES_GPU_ARCH=yes
# One spelling serves both vendors. TARGET_GPU_ARCH_FLAG is derived in mk/derive.mk from how
# the target's TARGET_GPU_ARCH is written — '--offload-arch=gfx90a' for an AMD card,
# '-gencode arch=compute_80,code=sm_80' for an NVIDIA one — because the NVIDIA form needs the
# number twice and a .conf value may hold only a bare $(NAME) reference, never a derivation.
# Setting this component's vendor here instead would mean a second .conf carrying a second
# copy of the source list below, and a stale copy of that list is exactly how this component
# first shipped with no device code in it.
#
# -O2 on the device code even in a debug build: the kernel's handoff store needs it, which
# Catalyst's own CMake also does for exactly this reason.
COMPONENT_CXXFLAGS=$(TARGET_GPU_ARCH_FLAG) -O2

COMPONENT_SOURCE_ROOTS=CATALYST

# Four groups, matching what Catalyst links into this library:
#   gpu_verbs/coprocessor  the session and the factory that exports the plugin symbol
#   common/coproc/gpu      the HIP plumbing and the device decoders — GpuLaunchers.hip is
#                          the file carrying the __global__ kernel
#   rdma/common            the verbs primitives, which Catalyst supplies via transport_common
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/rdma/gpu_verbs/coprocessor/GpuCoprocessorSession.cpp $(CATALYST)/runtime/lib/transport/rdma/gpu_verbs/coprocessor/GpuCoprocessorFactory.cpp $(CATALYST)/runtime/lib/transport/common/coproc/gpu/GpuRuntime.hip $(CATALYST)/runtime/lib/transport/common/coproc/gpu/GpuLaunchers.hip $(CATALYST)/runtime/lib/transport/rdma/common/CompletionQueue.cpp $(CATALYST)/runtime/lib/transport/rdma/common/Context.cpp $(CATALYST)/runtime/lib/transport/rdma/common/MemoryRegion.cpp $(CATALYST)/runtime/lib/transport/rdma/common/OobSocket.cpp $(CATALYST)/runtime/lib/transport/rdma/common/ProtectionDomain.cpp $(CATALYST)/runtime/lib/transport/rdma/common/QueuePair.cpp

# common/coproc is needed as well as common/coproc/gpu: steane_decoder.hpp reaches one directory
# up for SteaneLut.hpp, which is the include the example omits.
COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/gpu_verbs/coprocessor $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface $(CATALYST)/runtime/lib/transport/common/coproc $(CATALYST)/runtime/lib/transport/common/coproc/gpu

# hipcc links the HIP runtime itself; these are the two it does not.
COMPONENT_LIBS=ibverbs pthread

# COMPONENT_REQUIRES_NATIVE strips the framework's cross-link flags, and its $ORIGIN rpath is
# among them — so this is the one component that gets no $ORIGIN unless it asks. Without it the
# artifact carries only the driver's own absolute /opt/rocm-<version>/lib and relocatability
# rests entirely on machines.toml's LD_LIBRARY_PATH=".", which is a thin thing to rest on.
#
# Vendor-dialect, from mk/derive.mk, for the reason the quoting note there records: hipcc turns
# '-Wl,a,b' into '-Xcompiler -Wl,a,b' and nvcc then splits it on the commas, so the GNU
# spelling reaches the host compiler as three separate options and is rejected. That file also
# carries the '$$ORIGIN' quoting trap this line used to document — unquoted, it once produced
# RUNPATH='-libverbs:/opt/rocm-7.2.4/lib', consuming libibverbs as the rpath value so the
# artifact linked no libibverbs at all and died at load on 'undefined symbol:
# ibv_get_device_list'.
#
# No dtags flag here on purpose: ROCm's linker already emits DT_RUNPATH rather than DT_RPATH,
# and the --disable-new-dtags it would have countered is one of the stripped cross flags.
# `make verify` still reports the absolute vendor path, worth seeing rather than hiding.
COMPONENT_LDFLAGS=$(TARGET_GPU_ORIGIN_FLAG)

# Deliberately NOT optional. A bundle decides whether this component may be missing, through
# BUNDLE_OPTIONAL_COMPONENTS; marking it optional here turns a hard compile failure into
# EXIT=0 and "skipped (optional, failed)", which is how the broken example passed unnoticed.
