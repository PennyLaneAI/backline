# ─────────────────────────────────────────────────────────────────────────────
# The smallest complete component: sources inside this tree, no external
# checkout, no vendor SDK.
#
# It exists so that a new target can be validated in isolation. When bringing up a
# board, build this FIRST — if it compiles, links and verifies, then the toolchain,
# the sysroot and the flag derivation are all correct, and any later failure is
# about the application rather than the cross-build setup. Debugging those two
# things at once is what makes bring-up painful.
# ─────────────────────────────────────────────────────────────────────────────

COMPONENT_NAME=hello-world
COMPONENT_DESC="Minimal C++ program; use it to validate a new target end-to-end"
COMPONENT_KIND=executable
COMPONENT_OUTPUT=hello-world

# $(ROOT_DIR) is set by the build, so this needs no external source root and works
# from any checkout location.
COMPONENT_SOURCES=$(ROOT_DIR)/examples/hello-world/src/hello.cpp

# Stamped in at compile time so the binary can report which target it was built
# for. Both variables come from the target description.
COMPONENT_CXXFLAGS=-DBUILD_TARGET_NAME=\"$(TARGET_NAME)\" -DBUILD_TARGET_TRIPLE=\"$(TARGET_TRIPLE)\"
