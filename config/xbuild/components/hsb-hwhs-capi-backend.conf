# The controller for the VPK120 when its FPGA carries NVIDIA's Holoscan Sensor Bridge (HSB) and
# backline-hsb's hwhs-hsb engine in front of it, in place of ERNIC and hwhs. The engine plays
# hwhs's part: it stamps, sends and times the round, and HSB turns the request into the RDMA
# WRITE. A node names it with backend="hsb_hwhs"; the coprocessor at the other end needs wire=hsb.
#
# One component, as swhs: the session is compiled into this library. Nothing here touches
# ibverbs, since the A72 reaches the engine and HSB through UIO alone.
COMPONENT_NAME=hsb-hwhs-capi-backend
COMPONENT_DESC="Controller for the VPK120 behind Holoscan Sensor Bridge (hwhs-hsb)"
COMPONENT_KIND=shared-library

# The filename Catalyst derives from backend="hsb_hwhs", and what its CMake builds.
COMPONENT_OUTPUT=libcatalyst_transport_hsb_hwhs_controller.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/rdma/fpga_hsb/HsbBackend.cpp $(CATALYST)/runtime/lib/transport/rdma/fpga_hsb/HsbControllerSession.cpp $(CATALYST)/runtime/lib/transport/rdma/fpga_hsb/HsbDevice.cpp $(CATALYST)/runtime/lib/transport/rdma/common/OobSocket.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/lib/transport/rdma/fpga_hsb $(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface

COMPONENT_LIBS=pthread
