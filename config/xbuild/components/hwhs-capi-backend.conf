# The Catalyst transport backend that drives the hardware-handshake session.
# Transcribed from rdma_dev/cross-build-artifacts/libs/hwhs-capi-backend/Makefile.
#
# COMPONENT_OUTPUT is NOT derived from the component name, and must not be: transport
# plugins all export the same factory symbol and are selected by FILENAME, so this string
# is an interface. It is also what the SONAME becomes. Renaming it breaks every caller
# (CROSSBUILD.md, benchmark/Makefile, the Python device config).
COMPONENT_NAME=hwhs-capi-backend
COMPONENT_DESC="Catalyst transport backend for the FPGA hardware handshake"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=libcatalyst_transport_hwhs_controller.so

# The device sources live in Catalyst, at runtime/lib/transport/rdma/fpga_hwhs. They were carried
# in this repository until they were migrated upstream, so every path below now resolves under
# $(CATALYST) — the one external source root this component declares.
COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/rdma/fpga_hwhs/HwhsBackend.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/lib/transport/rdma/vendor $(CATALYST)/runtime/lib/transport/rdma/fpga_hwhs $(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface

# Replaces the old
#     SESSION_DIR := $(abspath $(CURDIR)/../hwhs-controller-session)
#     -L$(SESSION_DIR)/build/vpk120 -lhwhs_controller_session
# which encoded the sibling's directory, the build-dir convention, the board name and the
# sibling's output filename in one string, and re-invoked make on it by hand.
COMPONENT_DEPENDS=hwhs-controller-session

COMPONENT_LIBS=pthread dl rt
