# The FPGA hardware-handshake controller session — the VPK120 side of the QEC round trip.
# Transcribed from rdma_dev/cross-build-artifacts/libs/hwhs-controller-session/Makefile.
#
COMPONENT_NAME=hwhs-controller-session
COMPONENT_DESC="FPGA hardware-handshake controller session (VPK120 side of the QEC round trip)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=libhwhs_controller_session.so

# The device sources live in Catalyst, at runtime/lib/transport/rdma/fpga_hwhs. They were carried
# in this repository until they were migrated upstream, so every path below now resolves under
# $(CATALYST) — the one external source root this component declares.
COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/rdma/fpga_hwhs/HwhsControllerSession.cpp $(CATALYST)/runtime/lib/transport/rdma/common/CompletionQueue.cpp $(CATALYST)/runtime/lib/transport/rdma/common/Context.cpp $(CATALYST)/runtime/lib/transport/rdma/common/MemoryRegion.cpp $(CATALYST)/runtime/lib/transport/rdma/common/OobSocket.cpp $(CATALYST)/runtime/lib/transport/rdma/common/ProtectionDomain.cpp $(CATALYST)/runtime/lib/transport/rdma/common/QueuePair.cpp

# KEEP THE vendor ROOT: it holds a PATCHED infiniband/verbs.h whose struct ibv_context_ops has
# one extra member. That table is dispatched by offset, so building against the stock header
# shifts every later slot — clean compile, wrong function at run time. The sysroot's copy comes
# in via --sysroot, which is searched after every -I, so this include is what keeps it out.
# Order among these -I flags is not the guard (only vendor/ has an infiniband/); dropping it is
# what breaks it.
COMPONENT_INCLUDES=$(CATALYST)/runtime/lib/transport/rdma/vendor $(CATALYST)/runtime/lib/transport/rdma/fpga_hwhs $(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface

COMPONENT_LIBS=ibverbs pthread dl rt
