# Catalyst runtime C-API. Transcribed from
# rdma_dev/cross-build-artifacts/libs/rt-capi/Makefile, not from an example.
COMPONENT_NAME=rt-capi
COMPONENT_DESC="Catalyst runtime C-API"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=librt_capi.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/capi/RuntimeCAPI.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/capi $(CATALYST)/mlir/include $(CATALYST)/mlir/llvm-project/mlir/include

COMPONENT_CXXFLAGS=-DLIBREGISTRY=\"catalyst_callback_registry.so\"
COMPONENT_LIBS=pthread dl
