# Catalyst transport runtime: the C-API plus the ORC/custom_call wrappers.
# BOTH sources — the shipped example-transport-runtime.conf omits TransportWrappers.cpp,
# which links and then fails at dlopen on the board.
COMPONENT_NAME=rt-transport
COMPONENT_DESC="Catalyst transport runtime (C-API + ORC wrappers)"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=librt_transport.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/TransportCAPI.cpp $(CATALYST)/runtime/lib/transport/TransportWrappers.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/backend/common $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface

COMPONENT_LIBS=pthread dl
