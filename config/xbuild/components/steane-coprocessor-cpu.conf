# The Steane decoder as a loadable coprocessor function. A CPU coprocessor dlopens it by
# filename, which `demos/placement.py` and `benchmarks/placement.py` both name, so the
# output string is an interface.
COMPONENT_NAME=steane-coprocessor-cpu
COMPONENT_DESC="Steane decoder plugin for a CPU coprocessor"
COMPONENT_KIND=shared-library
COMPONENT_OUTPUT=libsteane_coprocessor_cpu.so

COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/common/coproc/cpu/steane_decoder_fn.cpp
COMPONENT_INCLUDES=$(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/common/interface $(CATALYST)/runtime/lib/transport/common/coproc

COMPONENT_LIBS=pthread
