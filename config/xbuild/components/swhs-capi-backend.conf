# The software-handshake controller for the VPK120: the CPU posts the syndrome through ibverbs and
# polls for the reply, rather than handing the round to the board's handshake engine.
#
# One component, not the two that hwhs needs. The session is compiled into this library rather than
# shipped beside it, which is why the bundle carries no libswhs_controller_session.so to match
# hwhs's. Transcribed from rdma_dev/devices/fpga_verbs/CMakeLists.txt, where the session is a STATIC
# archive linked PRIVATE into the shared object.
COMPONENT_NAME=swhs-capi-backend
COMPONENT_DESC="Software-handshake controller for the VPK120, with the CPU in the round trip"
COMPONENT_KIND=shared-library

# The filename the deployed bundle already carries, and the one a node asks for by
# init_args["backend_lib"], and the directory name Catalyst now uses for this device.
COMPONENT_OUTPUT=libcatalyst_transport_fpga_verbs_controller.so

# The device sources live in Catalyst, at runtime/lib/transport/rdma/fpga_verbs, so every path
# below resolves under $(CATALYST) — the one external source root this component declares.
COMPONENT_SOURCE_ROOTS=CATALYST
COMPONENT_SOURCES=$(CATALYST)/runtime/lib/transport/rdma/fpga_verbs/FpgaControllerFactory.cpp $(CATALYST)/runtime/lib/transport/rdma/fpga_verbs/FpgaControllerSession.cpp $(CATALYST)/runtime/lib/transport/rdma/common/CompletionQueue.cpp $(CATALYST)/runtime/lib/transport/rdma/common/Context.cpp $(CATALYST)/runtime/lib/transport/rdma/common/MemoryRegion.cpp $(CATALYST)/runtime/lib/transport/rdma/common/OobSocket.cpp $(CATALYST)/runtime/lib/transport/rdma/common/ProtectionDomain.cpp $(CATALYST)/runtime/lib/transport/rdma/common/QueuePair.cpp

# KEEP THE vendor ROOT: FpgaControllerSession.cpp and UmmLib.hpp include infiniband/verbs.h, and
# rdma/vendor holds the patched copy whose struct ibv_context_ops has one extra member. That
# table is dispatched by offset, so building against the stock header shifts every later slot:
# clean compile, wrong function at run time. The sysroot's copy arrives via --sysroot, which is
# searched after every -I, so this include is what keeps it out.
COMPONENT_INCLUDES=$(CATALYST)/runtime/lib/transport/rdma/vendor $(CATALYST)/runtime/lib/transport/rdma/fpga_verbs $(CATALYST)/runtime/include $(CATALYST)/runtime/lib/transport/rdma/common $(CATALYST)/runtime/lib/transport/common/interface

COMPONENT_LIBS=ibverbs pthread dl rt
