# Test fixture: an executable that depends on another component BY NAME.
#
# This is the case the original design handled by hardcoding the sibling's build
# path including the board name. Here the dependency is a name and the build system
# computes the path for whichever target is active.
COMPONENT_NAME=test-greet-app
COMPONENT_DESC="Test fixture: executable linking a sibling component by name"
COMPONENT_KIND=executable
COMPONENT_OUTPUT=greet-app
COMPONENT_SOURCES=$(ROOT_DIR)/examples/hello-world/src/uses-greet.cpp
COMPONENT_DEPENDS=test-greet-lib
