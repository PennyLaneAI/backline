# Target description generated by probe-target.sh on Thu Aug 13 14:37:55 UTC 2026
#
# Probed machine:
#   host    : f6e6ad6d5f6e
#   distro  : Ubuntu 24.04.3 LTS
#   kernel  : 6.8.0-87-generic
#   cpu     : ARMv8 Processor rev 0 (v8l)  (16 core(s))
#   RDMA    : no
#
# Save as targets/<name>.conf, and make TARGET_NAME match the filename.

TARGET_NAME=example-cross-aarch64
TARGET_DESC="Ubuntu 24.04.3 LTS on ARMv8 Processor rev 0 (v8l)"

TARGET_TRIPLE=aarch64-linux-gnu
TARGET_ARCH=aarch64
TARGET_ENDIAN=little

# TARGET_CPU is left EMPTY deliberately, even though this machine is a
# "ARMv8 Processor rev 0 (v8l)". Setting it makes binaries that crash with SIGILL on older chips of
# the same family. Set it only if the whole fleet is this exact part and you have
# measured a benefit.
TARGET_CPU=
TARGET_CPU_FLAG=mcpu

TARGET_LIBC=glibc
TARGET_LIBC_VERSION=2.39
TARGET_CXXABI_MAX=
TARGET_DYNAMIC_LINKER=/lib/ld-linux-aarch64.so.1

# Copy the sysroot straight off this machine — the libraries here are by
# definition the ones your binaries will meet at runtime.
SYSROOT_PROVIDER=ssh-rsync
SYSROOT_PROVIDER_ARGS="host=root@localhost port=2222"

TOOLCHAIN_KIND=llvm
TARGET_LINKER=lld
TARGET_STDLIB=libstdc++
TARGET_CXX_STANDARD=20

TARGET_RPATH=$$ORIGIN
TARGET_DEPLOY_DIR=/root/workspace
