# ─────────────────────────────────────────────────────────────────────────────
# A musl-based embedded aarch64 device (Alpine, Buildroot, or a Yocto image with
# musl selected).
#
# The reason this file is shipped: it is the case the original design *could not
# express*. That design's sysroot builder ran `debootstrap`, which only produces
# Debian-family glibc roots, and its ABI assumptions were glibc-shaped
# throughout. Nothing about cross-compiling actually requires glibc — the
# dependency was accidental, inherited from the one sysroot strategy that was
# implemented.
#
# Here musl is chosen by two data fields. No code changes.
# ─────────────────────────────────────────────────────────────────────────────

TARGET_NAME=example-embedded-musl
TARGET_DESC="Embedded aarch64 device running musl libc (Buildroot/Alpine class)"

TARGET_TRIPLE=aarch64-linux-musl
TARGET_ARCH=aarch64
TARGET_CPU=cortex-a72
TARGET_CPU_FLAG=mcpu

# musl has no per-symbol version tags the way glibc does, so the symbol-version
# ceiling check is not applicable and the verifier skips it automatically on
# seeing TARGET_LIBC=musl. It still checks the ELF class, machine type, and
# interpreter path, which are the checks that matter here.
TARGET_LIBC=musl
TARGET_LIBC_VERSION=
TARGET_CXXABI_MAX=

# musl's interpreter name embeds the architecture and is NOT ld-linux-*.
TARGET_DYNAMIC_LINKER=/lib/ld-musl-aarch64.so.1

# A Buildroot/Yocto build already produced a staging tree; consume it rather than
# trying to recreate it. This is what SYSROOT_PROVIDER=dir is for.
SYSROOT_PROVIDER=dir
SYSROOT_PROVIDER_ARGS="path=/opt/buildroot/output/staging"

TOOLCHAIN_KIND=llvm
TARGET_LINKER=lld

# musl toolchains commonly pair with libc++ rather than libstdc++; and on a small
# device, static-linking the C++ runtime avoids shipping it at all.
TARGET_STDLIB=libc++
TARGET_CXX_STANDARD=20
TARGET_CXXFLAGS="-fno-exceptions -fno-rtti"
TARGET_LDFLAGS="-static-libstdc++"

TARGET_RPATH=$$ORIGIN
TARGET_DEPLOY_DIR=/opt/app
