# ─────────────────────────────────────────────────────────────────────────────
# The build machine itself.
#
# Why bother having a target file for "here"? Because the alternative is a second
# code path. In the original tree, native builds (the GPU/verbs libraries, which
# needed hipcc and could not be cross-compiled) had their own hand-written
# Makefiles with their own flag conventions, their own hardcoded `clang++`, and
# no ABI verification at all. Two code paths mean two sets of bugs and twice the
# reading.
#
# Treating native as "a target whose sysroot happens to be /" collapses that back
# to one path. `make build TARGET=example-native` runs the same recipes,
# the same verifier, the same bundler.
#
# Use this as the base for a native target that needs a vendor compiler (CUDA,
# ROCm) — see components/SCHEMA.md, "components that cannot be cross-compiled".
# ─────────────────────────────────────────────────────────────────────────────

TARGET_NAME=example-native
TARGET_DESC="This build machine (native build, sysroot discovered from the host)"

# Left blank => tools/detect-host.sh fills it from the host compiler's
# -dumpmachine. Hardcoding x86_64 here would break the file on an arm64 laptop,
# which is exactly the class of assumption this redesign is removing.
TARGET_TRIPLE=
TARGET_ARCH=

TARGET_CPU=
# Blank, not 'march'. Which flag selects a CPU is an ARCHITECTURE fact — -mcpu on ARM,
# -march on x86 and RISC-V — and tools/arch-table.sh already holds it. Hardcoding one here
# was harmless only because TARGET_CPU above is empty, so nothing was emitted; the moment
# somebody named a CPU on an arm64 machine they would have got -march=<cpu>, which clang
# rejects for that architecture.
TARGET_CPU_FLAG=

# Blank => derived from the target's binary format in mk/derive.mk: glibc where that
# format is ELF, libSystem on a Mach-O host. Naming one of them here would make this file
# correct on one kind of machine and wrong on the other — the same assumption as
# hardcoding the triple, one field further down.
TARGET_LIBC=
# Blank => the verifier reads the ceiling from the host's own libc, because for a
# native build "what the target has" and "what I have" are the same thing by
# definition.
TARGET_LIBC_VERSION=

# "Where does THIS machine keep its headers and libraries" is a question with a different
# answer per platform, and a description cannot run a command to find out. The provider
# can: see sysroot/providers/native. It is '/' on Linux and the SDK that xcrun reports on
# macOS, where '/' holds no libraries at all.
SYSROOT_PROVIDER=native

TOOLCHAIN_KIND=llvm
# Blank => lld when cross-linking ELF (no per-target binutils needed), and the compiler
# driver's own linker on a Mach-O host, where ld64 ships with the Command Line Tools and
# lld would be an extra thing to install for no benefit.
TARGET_LINKER=
# Blank => libstdc++ for ELF, libc++ for Mach-O. macOS ships no libstdc++ at all, and clang
# ACCEPTS the flag there and then finds nothing, so a hardcoded value fails as a missing
# <string> rather than as a rejected option.
TARGET_STDLIB=
TARGET_CXX_STANDARD=20

# Blank => $$ORIGIN for ELF, @loader_path for Mach-O. Both mean "next to this file", and
# neither loader understands the other's spelling — but the Mach-O linker ACCEPTS
# $ORIGIN silently and records it, so getting this wrong produces a binary that links and
# verifies and then cannot find its own libraries.
TARGET_RPATH=
TARGET_DEPLOY_DIR=/tmp/example-native
