# ─────────────────────────────────────────────────────────────────────────────
# EXAMPLE — how a Xilinx VPK120 (Versal, Cortex-A72, PetaLinux) is described.
#
# This is an ILLUSTRATION, not the board. The real, probed description this project
# ships and builds against is `targets/vpk120.conf` — build with TARGET=vpk120, not
# TARGET=example-vpk120. `make list-targets` shows the real machine and the examples
# in separate groups so the two are never confused.
#
# Why keep an example next to the real one? Because it is the clearest possible
# statement of the tree's whole idea: supporting this board is *this file* and
# nothing else. There is no vpk120.cmake, no `vpk120:` make rule, no MYBOARD_FLAGS
# variable, no MYBOARD_SYSROOT. Everything a build needs is the data below; the
# engine under mk/ and tools/ never names this or any other machine.
#
# ── ILLUSTRATIVE VALUES. DO NOT BUILD AGAINST THIS. ──────────────────────────
# The three values that must never be guessed — libc version, C++ ABI ceilings and
# the ELF interpreter path — are filled in here with plausible numbers to show the
# shape, NOT read off a real unit, and the host it names does not resolve. For an
# actual board, `make probe TARGET=<name> SSH=user@host` writes these from the
# machine itself. The committed `vpk120.conf` was produced exactly that way.
# ─────────────────────────────────────────────────────────────────────────────

TARGET_NAME=example-vpk120
TARGET_DESC="EXAMPLE illustration of a VPK120 description — build the REAL board with TARGET=vpk120"

# ── machine ──────────────────────────────────────────────────────────────────
TARGET_TRIPLE=aarch64-linux-gnu
TARGET_ARCH=aarch64
# A microarchitecture lets the compiler use instructions only this part has: faster
# here, SIGILL on an older chip in the same family. Left empty in the real vpk120.conf
# on purpose; shown here only to illustrate the field.
TARGET_CPU=cortex-a72
TARGET_CPU_FLAG=mcpu

# ── ABI contract with the running system ─────────────────────────────────────
# `make probe` reads these off the machine and prints the exact lines to paste. Do
# not hand-write them: a wrong TARGET_LIBC_VERSION becomes a runtime `symbol lookup
# error` on the device with no useful context.
TARGET_LIBC=glibc
TARGET_LIBC_VERSION=2.39
TARGET_CXXABI_MAX=GLIBCXX_3.4.32 CXXABI_1.3.14

# PetaLinux and many embedded roots put the aarch64 ELF interpreter at /lib, not the
# Debian multiarch /lib/aarch64-linux-gnu. Wrong value => "No such file or directory"
# for a binary that visibly exists. `make verify` checks this before you ship.
TARGET_DYNAMIC_LINKER=/lib/ld-linux-aarch64.so.1

# ── sysroot ──────────────────────────────────────────────────────────────────
# If you can reach the board, copy its real libraries — they are by definition the
# correct ones. See docs/04-sysroot-providers.md for when each provider fits. (The
# real vpk120.conf uses the `deb` provider because that board is not reachable from
# the build host; this example shows the reachable case.)
SYSROOT_PROVIDER=ssh-rsync
SYSROOT_PROVIDER_ARGS="host=user@my-vpk120.local port=22"

# ── toolchain ────────────────────────────────────────────────────────────────
TOOLCHAIN_KIND=llvm
TARGET_LINKER=lld
TARGET_STDLIB=libstdc++
TARGET_CXX_STANDARD=20

# ── runtime layout ───────────────────────────────────────────────────────────
# $$ORIGIN (escaped for Make) => each .so looks next to itself for its siblings, so
# the bundle works wherever it is unpacked and needs no LD_LIBRARY_PATH.
TARGET_RPATH=$$ORIGIN
TARGET_DEPLOY_DIR=/home/petalinux/workspace
