# ─────────────────────────────────────────────────────────────────────────────
# A generic x86_64 Linux server — the role the "dell" and "threadripper" played
# in the original tree.
#
# Note what is NOT here: no distro name, no Ubuntu, no glibc release codename.
# The original design asked you for a Debian/Ubuntu release codename (`noble`,
# `jammy`) because its only sysroot strategy was debootstrap, which made the
# build system structurally unable to target a machine that was not
# Debian-family. Here the distro is simply not a concept the build system knows
# about; it copies whatever libc the machine actually has.
# ─────────────────────────────────────────────────────────────────────────────

TARGET_NAME=example-x86-server
TARGET_DESC="Generic x86_64 Linux server (RDMA host / coprocessor role)"

TARGET_TRIPLE=x86_64-linux-gnu
TARGET_ARCH=x86_64

# Empty TARGET_CPU on purpose. Baking -march=znver3 into a binary means it
# SIGILLs on any older chip, and the failure looks like a corrupt binary rather
# than a wrong flag. Set a CPU only when you have measured that you need it, and
# only when the fleet is homogeneous.
TARGET_CPU=
TARGET_CPU_FLAG=march

TARGET_LIBC=glibc
TARGET_LIBC_VERSION=2.39
TARGET_CXXABI_MAX=GLIBCXX_3.4.33

SYSROOT_PROVIDER=ssh-rsync
SYSROOT_PROVIDER_ARGS="host=user@server.example.internal port=22"

TOOLCHAIN_KIND=llvm
TARGET_LINKER=lld
TARGET_STDLIB=libstdc++
TARGET_CXX_STANDARD=20

TARGET_RPATH=$$ORIGIN
TARGET_DEPLOY_DIR=/opt/backline
