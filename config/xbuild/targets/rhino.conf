# Target description generated by probe-target.sh on Fri Nov  6 2026
#
# Probed machine:
#   host    : rhino
#   distro  : Ubuntu 22.04.4 LTS
#   kernel  : 6.8.0-1040-nvidia-64k (64 KiB pages)
#   cpu     : NVIDIA Grace (Neoverse-V2, ARM part 0xd4f), 72 cores
#   GPU     : H100 in a GH200 480GB, CUDA 12.4
#   RDMA    : yes (ConnectX-7, mlx5_1 to the VPK120)

TARGET_NAME=rhino
TARGET_DESC="Ubuntu 22.04.4 LTS on NVIDIA GH200 (Grace + H100)"

TARGET_TRIPLE=aarch64-linux-gnu
TARGET_ARCH=aarch64
TARGET_ENDIAN=little

TARGET_CPU=
TARGET_CPU_FLAG=mcpu

# The H100 in the GH200. nvidia-smi --query-gpu=compute_cap reports 9.0.
TARGET_GPU_ARCH=sm_90

TARGET_LIBC=glibc
TARGET_LIBC_VERSION=2.35
TARGET_CXXABI_MAX=GLIBCXX_3.4.35 CXXABI_1.3.17
TARGET_DYNAMIC_LINKER=/lib/ld-linux-aarch64.so.1

# rhino's login needs Duo, so this provider's own ssh connection can't authenticate. Copy
# /usr/lib, /usr/lib64, /usr/include, /usr/local/lib and /usr/local/include off it some other
# way and pass the copy on the make line instead. mode=copy lets `make sysroot` rewrite the
# absolute symlinks (libm.so among them); a referenced tree keeps them and links libm statically.
#     make sysroot TARGET=rhino SYSROOT_PROVIDER=dir SYSROOT_PROVIDER_ARGS="path=/path/to/copy mode=copy"
SYSROOT_PROVIDER=ssh-rsync
SYSROOT_PROVIDER_ARGS="host=192.168.3.12 port=22"

TOOLCHAIN_KIND=llvm
TARGET_LINKER=lld
TARGET_STDLIB=libstdc++
TARGET_CXX_STANDARD=20
TARGET_RPATH=$$ORIGIN

# Left empty, which mk/derive.mk turns into /tmp/rhino: a login on a shared server belongs to a
# person, so no account's home directory goes here.
TARGET_DEPLOY_DIR=
