# ─────────────────────────────────────────────────────────────────────────────
# TEST FIXTURE — used by tests/run-tests.sh and by `make quickstart` as a fallback.
#
# It targets the build machine itself through the system GCC, so the whole pipeline
# (sysroot -> build -> verify -> bundle -> run) can be exercised on a host that has
# no clang and no cross toolchain. It also keeps the TOOLCHAIN_KIND=gcc code path
# covered, which would otherwise rot unnoticed since llvm is the default.
#
# Keep it. Deleting it makes the test suite skip its end-to-end coverage silently.
#
# The ABI values below describe THIS machine and are checked by the suite; if you run
# the tests on a host with a different glibc, regenerate them with:
#     sh sysroot/probe/probe-target.sh --name=test-native-gcc
# ─────────────────────────────────────────────────────────────────────────────
TARGET_NAME=test-native-gcc
# NOT a native target on every machine, despite the name: every field below names one
# particular kind of host (x86_64, glibc, a triple-prefixed GCC, the bfd linker, an ELF
# interpreter path). It is kept as the worked example of TOOLCHAIN_KIND=gcc, and it is
# native only when you are on x86_64 Linux.
#
# tests/run-tests.sh no longer builds against it, for exactly that reason: it generates a
# description from the host instead, so the suite passes on any machine. If you want a
# "this machine" target, use example-native, which discovers everything.
TARGET_DESC="Cross/native to x86_64 Linux via a prefixed GCC (TOOLCHAIN_KIND=gcc example)"
TARGET_TRIPLE=x86_64-linux-gnu
TARGET_ARCH=x86_64
TARGET_CPU=
TARGET_CPU_FLAG=march
TARGET_LIBC=glibc
TARGET_LIBC_VERSION=2.36
TARGET_CXXABI_MAX=GLIBCXX_3.4.30
TARGET_DYNAMIC_LINKER=/lib64/ld-linux-x86-64.so.2
SYSROOT_PROVIDER=dir
SYSROOT_PROVIDER_ARGS="path=/"
TOOLCHAIN_KIND=gcc
TOOLCHAIN_PREFIX=x86_64-linux-gnu-
TARGET_LINKER=bfd
TARGET_STDLIB=libstdc++
TARGET_CXX_STANDARD=20
TARGET_RPATH=$$ORIGIN
TARGET_DEPLOY_DIR=/tmp/test-native-gcc
