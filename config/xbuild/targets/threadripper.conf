# Target description generated by probe-target.sh on Thu Aug 20 04:53:49 PM EDT 2026
#
# Probed machine:
#   host    : xanadu-WRX90-WS-EVO
#   distro  : Ubuntu 24.04.4 LTS
#   kernel  : 6.8.0-94-generic
#   cpu     : AMD Ryzen Threadripper PRO 9975WX 32-Cores  (48 core(s))
#   RDMA    : yes
#
# Save as targets/<name>.conf, and make TARGET_NAME match the filename.

TARGET_NAME=threadripper
TARGET_DESC="Ubuntu 24.04.4 LTS on AMD Ryzen Threadripper PRO 9975WX 32-Cores"

TARGET_TRIPLE=x86_64-linux-gnu
TARGET_ARCH=x86_64
TARGET_ENDIAN=little

# TARGET_CPU is left EMPTY deliberately, even though this machine is a
# "AMD Ryzen Threadripper PRO 9975WX 32-Cores". Setting it makes binaries that crash with SIGILL on older chips of
# the same family. Set it only if the whole fleet is this exact part and you have
# measured a benefit.
TARGET_CPU=
TARGET_CPU_FLAG=march

# The GPU a component compiling device code emits for. gfx90a is the MI210 this machine
# holds — `rocminfo` on it reports gfx90a, and `make probe` now pre-fills this field from
# that. It is a DECISION, not a probed fact: a re-probe leaves it alone, because a bundle
# may deliberately target a different card than the machine it was probed from. Override
# for one build with GPU_ARCH=<arch> on the make command line.
TARGET_GPU_ARCH=gfx90a

TARGET_LIBC=glibc
TARGET_LIBC_VERSION=2.39
TARGET_CXXABI_MAX=GLIBCXX_3.4.33 CXXABI_1.3.15
TARGET_DYNAMIC_LINKER=/lib64/ld-linux-x86-64.so.2

# Copy the sysroot straight off this machine — the libraries here are by
# definition the ones your binaries will meet at runtime.
SYSROOT_PROVIDER=ssh-rsync
# NO ACCOUNT NAMED HERE, deliberately. `host=` without a `user@` means ssh reaches the
# machine as whoever is running the build, which is the same rule config/machines.toml
# states for a table naming no `user`. A description is shared; an account is not.
#
# TO USE A PARTICULAR ACCOUNT, put it back on this line rather than anywhere else:
#     SYSROOT_PROVIDER_ARGS="host=you@192.168.3.14 port=22"
# It cannot be overridden from the environment — provider arguments belong to the
# description — so for a one-off, pass the whole value on the make line instead:
#     make sysroot TARGET=threadripper SYSROOT_PROVIDER_ARGS="host=you@192.168.3.14 port=22"
SYSROOT_PROVIDER_ARGS="host=192.168.3.14 port=22"

TOOLCHAIN_KIND=llvm
TARGET_LINKER=lld
TARGET_STDLIB=libstdc++
# 20, and not something probed: the C++ standard is a property of the SOURCE you intend
# to build, which a machine probe cannot see. It is written as 20 because that is this
# tree's minimum (Catalyst's headers use C++20 concepts). mk/derive.mk raises anything
# lower anyway, so editing this down does not achieve what it looks like it achieves.
TARGET_CXX_STANDARD=20

TARGET_RPATH=$$ORIGIN

# Left EMPTY, which mk/derive.mk turns into /tmp/threadripper. It named one person's home
# directory, and `make deploy` would then write a bundle into someone else's account.
# Unlike the board's /home/petalinux, which is a role the device ships with, a login on a
# shared server belongs to a person.
#
# TO DEPLOY SOMEWHERE OF YOUR OWN, name it here — the value is documentation and input to
# `make deploy` only, and is never compiled into an artifact:
#     TARGET_DEPLOY_DIR=/home/you/workspace
TARGET_DEPLOY_DIR=
