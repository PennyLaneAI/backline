# Save as targets/<name>.conf, and make TARGET_NAME match the filename.

TARGET_NAME=vpk120
TARGET_DESC="Xilinx VPK120 — PetaLinux 2024.2 (scarthgap), Cortex-A72. THE REAL BOARD."

TARGET_TRIPLE=aarch64-linux-gnu
TARGET_ARCH=aarch64
TARGET_ENDIAN=little

# TARGET_CPU is left EMPTY deliberately, even though this machine is a
# "Cortex-A72". Setting it makes binaries that crash with SIGILL on older chips of
# the same family. Set it only if the whole fleet is this exact part and you have
# measured a benefit.
TARGET_CPU=
TARGET_CPU_FLAG=mcpu

TARGET_LIBC=glibc
TARGET_LIBC_VERSION=2.39
TARGET_CXXABI_MAX=GLIBCXX_3.4.32 CXXABI_1.3.14
TARGET_DYNAMIC_LINKER=/lib/ld-linux-aarch64.so.1

TOOLCHAIN_KIND=llvm
TARGET_LINKER=lld
TARGET_STDLIB=libstdc++
# 20, and not something probed: the C++ standard is a property of the SOURCE you intend
# to build, which a machine probe cannot see. It is written as 20 because that is this
# tree's minimum (Catalyst's headers use C++20 concepts). mk/derive.mk raises anything
# lower anyway, so editing this down does not achieve what it looks like it achieves.
TARGET_CXX_STANDARD=20

TARGET_RPATH=$$ORIGIN
TARGET_DEPLOY_DIR=/home/petalinux/workspace

# ── how to obtain this sysroot ───────────────────────────────────────────────
#
# The board itself cannot be its own sysroot: checked over ssh, its PetaLinux rootfs has no
# headers, no libc.so linker name and no crt objects, and PetaLinux has no apt to add them.
# Three sources work, and they differ in a way that matters. Measured against the board
# (glibc 2.39, GLIBCXX_3.4.32, CXXABI_1.3.14):
#
#   AMD PetaLinux SDK      matches on all three axes. The only source that does, because it
#                          IS the toolchain the board's userspace was built with. Not
#                          fetchable from a mirror; comes from the Xilinx installer.
#     SYSROOT_PROVIDER=dir
#     SYSROOT_PROVIDER_ARGS="path=<...>/sysroots/vpk120-amd"
#     Caveat: ships no libstdc++.a, so COMPONENT_STATIC_CXX=yes cannot link against it.
#
#   Ubuntu noble           right glibc, and a libstdc++ ONE VERSION TOO NEW on both C++ axes
#                          (3.4.33 / 1.3.15) because noble's libstdc++6 package is GCC 14's
#                          runtime while the board's is GCC 13.2. Safe only while no
#                          artifact references the newer symbols — which is exactly what
#                          TARGET_CXXABI_MAX above turns from a hope into a build-time check.
#                          Set the CXX ABI ceilings above from a probe of the real board so
#                          this approximation is checked rather than trusted.
#
# Assembling that noble sysroot reproducibly, on any host, with no root and no qemu:
#     SYSROOT_PROVIDER=deb
#     SYSROOT_PROVIDER_ARGS="suite=noble add=libibverbs-dev,libibverbs1"
#
# libibverbs-dev is NOT optional and NOT a default: hwhs-controller-session links -libverbs,
# and without it the build stops with "the sysroot cannot link it". The tree this was
# migrated from installed it via EXTRA_PACKAGES inside a debootstrap chroot, and the record
# of having done so (the .kv file) is gone — so the working sysroot could not be rebuilt
# from anything written down. Naming it here is the point.
#
# The equivalent through debootstrap, which needs a Linux host and root:
#     SYSROOT_PROVIDER=debootstrap
#     SYSROOT_PROVIDER_ARGS="release=noble arch=arm64 packages=libibverbs-dev"
# The default is the reproducible one: it needs nothing but a network, works on any host,
# and records every package version it resolved into the sysroot itself. Switch to the
# SDK line above when you need an exact ABI match or a static libstdc++.
SYSROOT_PROVIDER=deb
SYSROOT_PROVIDER_ARGS="suite=noble add=libibverbs-dev,libibverbs1"
