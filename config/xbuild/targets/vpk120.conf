#             infrastructure names. The facts below are what the build needs.)
#   distro  : PetaLinux 2024.2+release-S11061705 (scarthgap)
#   kernel  : 6.6.40-xilinx-g0e8e004b0544
#   cpu     : Cortex-A72  (2 core(s))
